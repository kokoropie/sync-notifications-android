buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Upload mapping.txt của R8 lên Sentry; chỉ nạp khi có token (cùng điều kiện với sentry.gradle trong app/build.gradle)
        if (System.getenv('SENTRY_AUTH_TOKEN')) {
            classpath("io.sentry:sentry-android-gradle-plugin:6.23.0")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
