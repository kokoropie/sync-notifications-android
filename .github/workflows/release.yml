name: Build APK

# Push lên main chỉ để làm nóng cache Gradle: cache chỉ được ghi từ nhánh mặc định,
# tag đọc lại từ đó (nếu không có lần chạy nào trên main thì mọi lần build đều từ đầu).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "App.tsx"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "metro.config.js"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Hủy lần chạy cũ khi có commit mới trên cùng nhánh (tag thì không bao giờ hủy)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write   # tạo GitHub Release khi push tag

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Có đủ secrets thì ký bằng khóa release của bạn; thiếu thì APK ký bằng khóa debug (không cập nhật đè được lên bản ký khác)
      - name: Set up release signing
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::warning::Chưa cấu hình secrets ký APK, dùng khóa debug"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
          {
            echo "storeFile=app/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-notify}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        run: >
          ./gradlew assembleRelease
          --console=plain
          -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
          -PreactNativeArchitectures=arm64-v8a
          -PappVersionName=${{ steps.ver.outputs.version }}
          -PappVersionCode=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/SyncNotification-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SyncNotification-apk
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
